name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ios-pipeline-test:
    name: iOS Pipeline Integration Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Check iOS Simulator Runtime
        run: |
          # macos-15 runners ship with iOS 18 simulator pre-installed.
          # Only attempt download if no runtime is available.
          if xcrun simctl list runtimes 2>/dev/null | grep -q "iOS"; then
            echo "iOS runtime already available:"
            xcrun simctl list runtimes | grep iOS
          else
            echo "No iOS runtime found, downloading..."
            sudo xcodebuild -downloadPlatform iOS
          fi

      # ── ONNX Runtime xcframework ──────────────────────────────────
      - name: Cache ONNX Runtime
        id: cache-ort
        uses: actions/cache@v4
        with:
          path: FunASR-iOS/cpp_inference/lib/onnxruntime.xcframework
          key: onnxruntime-1.21.0

      - name: Download ONNX Runtime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        run: |
          curl -L -o ort.zip \
            https://download.onnxruntime.ai/pod-archive-onnxruntime-c-1.21.0.zip
          unzip -o ort.zip
          # The zip extracts onnxruntime.xcframework at top level
          mkdir -p FunASR-iOS/cpp_inference/lib/
          mv onnxruntime.xcframework FunASR-iOS/cpp_inference/lib/onnxruntime.xcframework
          ls -la FunASR-iOS/cpp_inference/lib/onnxruntime.xcframework/

      # ── ASR models (GitHub Releases) ──────────────────────────────
      - name: Cache ASR models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: ci_models/
          key: asr-models-${{ hashFiles('ci/model_versions.txt') }}

      - name: Download models from GitHub Releases
        if: steps.cache-models.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci_models
          gh release download models-v1.0 \
            --repo ${{ github.repository }} \
            --pattern "sensevoice.int8.onnx" \
            --pattern "sensevoice_tokens.txt" \
            --pattern "paraformer_enc.int8.onnx" \
            --pattern "paraformer_dec.int8.onnx" \
            --pattern "paraformer_am.mvn" \
            --pattern "paraformer_tokens.txt" \
            --dir ci_models/
          echo "Downloaded models:"
          ls -lh ci_models/

      # ── Stage models with names the Xcode project and C++ engine expect ──
      - name: Stage model files for build
        run: |
          mkdir -p FunASR-iOS/cpp_inference/models/
          # SenseVoice
          cp ci_models/sensevoice.int8.onnx   FunASR-iOS/cpp_inference/models/sensevoice.int8.onnx
          cp ci_models/sensevoice_tokens.txt   FunASR-iOS/cpp_inference/models/sensevoice_tokens.txt
          # Paraformer
          cp ci_models/paraformer_enc.int8.onnx  FunASR-iOS/cpp_inference/models/paraformer_encoder.int8.onnx
          cp ci_models/paraformer_dec.int8.onnx  FunASR-iOS/cpp_inference/models/paraformer_decoder.int8.onnx
          cp ci_models/paraformer_am.mvn          FunASR-iOS/cpp_inference/models/am.mvn
          # Paraformer tokens: convert "token index\n" txt → JSON array (engine calls load_tokens_json)
          python3 -c "import json; t=[l.split()[0] for l in open('ci_models/paraformer_tokens.txt') if l.strip()]; open('FunASR-iOS/cpp_inference/models/paraformer_tokens.json','w').write(json.dumps(t,ensure_ascii=False)); print(f'Converted {len(t)} tokens to JSON')"
          ls -lh FunASR-iOS/cpp_inference/models/

      # ── CI accuracy fixtures ──────────────────────────────────────
      - name: Cache CI fixtures
        id: cache-fixtures
        uses: actions/cache@v4
        with:
          path: ci_fixtures/
          key: ci-fixtures-${{ hashFiles('ci/fixture_versions.txt') }}

      - name: Download CI fixtures
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci_fixtures
          gh release download test-fixtures-v1.0 \
            --repo ${{ github.repository }} \
            --pattern "ramc_fixtures.tar.gz" \
            --pattern "aishell1_fixtures.tar.gz" \
            --dir ci_fixtures/
          tar -xzf ci_fixtures/ramc_fixtures.tar.gz    -C ci_fixtures/
          tar -xzf ci_fixtures/aishell1_fixtures.tar.gz -C ci_fixtures/
          echo "Fixtures:"
          find ci_fixtures/ -name "*.wav" | wc -l

      # ── Build + Test ──────────────────────────────────────────────
      - name: Build and run pipeline tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FunASR-iOS.xcodeproj \
            -scheme FunASR-iOS \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -skip-testing:FunASR-iOSUITests \
            -resultBundlePath TestResults.xcresult \
            -testenv EVAL_AUDIO_DIR=${{ github.workspace }}/ci_fixtures \
            MODEL_DIR=${{ github.workspace }}/FunASR-iOS/cpp_inference/models \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log

      # ── Accuracy report ───────────────────────────────────────────
      - name: Generate accuracy report
        if: always()
        run: |
          python3 scripts/parse_test_results.py \
            --results-json ci_fixtures/batch_eval_results.json \
            --log build.log \
            --baseline-dir eval_results/ \
            --output accuracy_report.md
          cat accuracy_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build.log
            TestResults.xcresult
            accuracy_report.md
